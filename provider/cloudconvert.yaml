identity:
  author: "erbanku"
  name: "cloudconvert"
  label:
    en_US: "CloudConvert"
  description:
    en_US: "Convert PDF, Word, Excel, PowerPoint, and other office-related files through the CloudConvert API using Dify native file inputs and file outputs."
  icon: "icon.svg"
  tags:
    - "productivity"
    - "utilities"
tools:
  - "tools/pdf_to_docx.yaml"
  - "tools/office_to_pdf.yaml"
  - "tools/convert_office_file.yaml"
  - "tools/list_supported_conversions.yaml"
extra:
  python:
    source: "provider/cloudconvert.py"
credentials_for_provider:
  api_key:
    type: "secret-input"
    required: true
    label:
      en_US: "CloudConvert API Key"
    placeholder:
      en_US: "Enter your CloudConvert API key"
    help:
      en_US: "Create an API key in the CloudConvert dashboard with task.read and task.write scopes."
  api_base_url:
    type: "text-input"
    required: false
    label:
      en_US: "API Base URL"
    placeholder:
      en_US: "https://api.cloudconvert.com/v2"
    help:
      en_US: "Optional override for region or sandbox endpoints, such as https://sandbox.api.cloudconvert.com/v2."
