identity:
  author: "erbanku"
  name: "convert_office_file"
  label:
    en_US: "Convert Office File"
description:
  human:
    en_US: "Convert a Dify uploaded office-related file to another supported office format."
  llm: "Generic CloudConvert file conversion for office-related formats. Supports common Word, Excel, PowerPoint, PDF, text, CSV, HTML, and OpenDocument targets."
parameters:
  - name: "input_file"
    type: "file"
    required: true
    label:
      en_US: "Input File"
    form: "llm"
    human_description:
      en_US: "The file to convert."
    llm_description: "Dify uploaded file to convert."
  - name: "output_format"
    type: "select"
    required: true
    label:
      en_US: "Output Format"
    form: "llm"
    human_description:
      en_US: "Target file format."
    llm_description: "Target output format. Choose one of the listed office-related formats."
    options:
      - label:
          en_US: "PDF"
        value: "pdf"
      - label:
          en_US: "DOCX"
        value: "docx"
      - label:
          en_US: "DOC"
        value: "doc"
      - label:
          en_US: "XLSX"
        value: "xlsx"
      - label:
          en_US: "XLS"
        value: "xls"
      - label:
          en_US: "CSV"
        value: "csv"
      - label:
          en_US: "PPTX"
        value: "pptx"
      - label:
          en_US: "PPT"
        value: "ppt"
      - label:
          en_US: "TXT"
        value: "txt"
      - label:
          en_US: "HTML"
        value: "html"
      - label:
          en_US: "RTF"
        value: "rtf"
      - label:
          en_US: "ODT"
        value: "odt"
      - label:
          en_US: "ODS"
        value: "ods"
      - label:
          en_US: "ODP"
        value: "odp"
      - label:
          en_US: "PNG"
        value: "png"
      - label:
          en_US: "JPG"
        value: "jpg"
  - name: "input_format"
    type: "string"
    required: false
    label:
      en_US: "Input Format"
    form: "llm"
    human_description:
      en_US: "Optional input format override."
    llm_description: "Optional source format, such as pdf, docx, xlsx, or pptx. Usually inferred from the filename."
  - name: "engine"
    type: "string"
    required: false
    label:
      en_US: "Engine"
    form: "form"
    human_description:
      en_US: "Optional CloudConvert engine override."
    llm_description: "Optional CloudConvert engine override."
  - name: "engine_version"
    type: "string"
    required: false
    label:
      en_US: "Engine Version"
    form: "form"
    human_description:
      en_US: "Optional CloudConvert engine version."
    llm_description: "Optional CloudConvert engine version."
  - name: "options_json"
    type: "string"
    required: false
    label:
      en_US: "Extra Options JSON"
    form: "form"
    human_description:
      en_US: "Optional JSON object of CloudConvert convert task options."
    llm_description: "Optional JSON object with extra CloudConvert convert task options."
  - name: "wait_timeout_seconds"
    type: "number"
    required: false
    label:
      en_US: "Wait Timeout Seconds"
    form: "form"
    human_description:
      en_US: "Maximum time to wait for the conversion job."
    llm_description: "Maximum time to wait for the conversion job."
    default: 300
    min: 30
    max: 900
output_schema:
  type: object
  properties:
    status:
      type: string
    job_id:
      type: string
    export_task_id:
      type: string
    output_filename:
      type: string
    output_format:
      type: string
    output_file_count:
      type: number
    output_files:
      type: array
      items:
        type: object
extra:
  python:
    source: "tools/convert_office_file.py"
